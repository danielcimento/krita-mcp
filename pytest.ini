[pytest]
# Unit tests (no Krita) and live tests (skipped unless KRITA_MCP_LIVE=1).
# tests/krita is the headless suite: it imports `krita` and runs inside
# Krita via kritarunner (`make test-krita`), never under pytest.
testpaths = tests/unit tests/live
norecursedirs = tests/krita .* __pycache__ *.egg build dist venv node_modules
# Repo root for `import server`; krita-plugin for the pure plugin modules.
pythonpath = . krita-plugin
addopts = -ra
markers =
    live: needs a running GUI Krita with this checkout's plugin (KRITA_MCP_LIVE=1)
